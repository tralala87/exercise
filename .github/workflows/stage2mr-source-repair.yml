name: Stage2M-R source feasibility repair

on:
  pull_request:
    branches: [main]
    paths:
      - "forecasting_2/stage2mr_source_relay/**"
      - ".github/workflows/stage2mr-source-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-replacement-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic dependencies
        run: python -m pip install "numpy==2.1.3" "requests==2.32.5"

      - name: Download and validate replacement before predictions
        run: |
          python forecasting_2/stage2mr_source_relay/build_replacement.py \
            forecasting_2/stage2mr_source_relay/STAGE2MR_PRE_VALUE_MANIFEST.json \
            forecasting_2/stage2mr_source_relay/FROZEN_STAGE2MR_SOURCE_FEASIBILITY_ADDENDUM.md \
            stage2mr_source_output

      - name: Show decision
        run: cat stage2mr_source_output/RUN_DECISION.json

      - name: Upload immutable replacement source
        uses: actions/upload-artifact@v4
        with:
          name: stage2mr-electricity-weekly-replacement
          path: stage2mr_source_output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
