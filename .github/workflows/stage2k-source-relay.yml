name: Stage2K M1 Tourism source relay

on:
  pull_request:
    branches: [main]
    paths:
      - "forecasting_2/stage2k_source_relay/**"
      - ".github/workflows/stage2k-source-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install deterministic Python dependencies
        run: python -m pip install "pandas==2.2.3"

      - name: Download pinned CRAN data objects
        run: |
          mkdir -p stage2k_source_output
          curl -L --fail --retry 3 \
            -o stage2k_source_output/M1.rda \
            https://raw.githubusercontent.com/cran/Mcomp/28f4e9babfe26607c9274c2c8d0e900a6aa61eec/data/M1.rda
          curl -L --fail --retry 3 \
            -o stage2k_source_output/tourism.rda \
            https://raw.githubusercontent.com/cran/Tcomp/8420cd2fcc2797d3b4ae7cc2c71dddbaf35010b7/data/tourism.rda
          echo "78a8fd28b46f657836f577b636ba70e4  stage2k_source_output/M1.rda" | md5sum -c -
          echo "4cb8e6288b0dd6897c05d7e8be389d59  stage2k_source_output/tourism.rda" | md5sum -c -

      - name: Extract exact source values
        run: |
          Rscript forecasting_2/stage2k_source_relay/extract_m1_tourism.R \
            stage2k_source_output/M1.rda \
            stage2k_source_output/tourism.rda \
            stage2k_source_output

      - name: Freeze source manifest
        run: python forecasting_2/stage2k_source_relay/finalize_source_suite.py stage2k_source_output

      - name: Show decision
        run: cat stage2k_source_output/RUN_DECISION.json

      - name: Upload immutable source suite
        uses: actions/upload-artifact@v4
        with:
          name: stage2k-m1-tourism-source-suite
          path: stage2k_source_output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
