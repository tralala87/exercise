name: Stage3B latent-action contrastive gate

on:
  pull_request:
    branches: [main]
    paths:
      - "forecasting_2/stage3b_latent_action/**"
      - ".github/workflows/stage3b-latent-action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<2.8"
          python -m pip install "numpy<2.1" "pandas<2.3" "scikit-learn<1.8" nbformat nbconvert ipykernel

      - name: Syntax and smoke validation
        run: |
          python -m py_compile forecasting_2/stage3b_latent_action/run_stage3b.py
          python forecasting_2/stage3b_latent_action/run_stage3b.py \
            --output stage3b_smoke \
            --smoke
          test -f stage3b_smoke/FINAL_DECISION.json
          test -f stage3b_smoke/VALIDATION.json

      - name: Execute frozen full Stage 3B experiment
        run: |
          python forecasting_2/stage3b_latent_action/run_stage3b.py \
            --output stage3b_full

      - name: Show machine decision
        if: always()
        run: |
          if [ -f stage3b_full/FINAL_DECISION.json ]; then
            cat stage3b_full/FINAL_DECISION.json
          elif [ -f stage3b_full/EXECUTION_FAILURE.json ]; then
            cat stage3b_full/EXECUTION_FAILURE.json
          else
            echo '{"status":"NO_FULL_DECISION_ARTIFACT"}'
          fi

      - name: Verify full artifact manifest
        if: always()
        run: |
          if [ -f stage3b_full/MANIFEST.sha256 ]; then
            (cd stage3b_full && sha256sum -c MANIFEST.sha256)
          fi

      - name: Upload immutable Stage 3B result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-latent-action-result
          path: |
            stage3b_full/
            stage3b_full_Bundle.zip
            stage3b_full_Bundle.zip.sha256
            stage3b_smoke/FINAL_DECISION.json
            stage3b_smoke/VALIDATION.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
