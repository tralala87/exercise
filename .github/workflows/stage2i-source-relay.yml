name: Stage2I canonical source relay

on:
  pull_request:
    branches: [main]
    paths:
      - "forecasting_2/stage2i_source_relay/**"
      - ".github/workflows/stage2i-source-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install frozen data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "datasetsforecast==1.0.0" \
            "pandas<2.3" \
            "numpy<2.1" \
            requests xlrd openpyxl

      - name: Build exact-source canonical suite or record a fail-closed blocker
        run: |
          python forecasting_2/stage2i_source_relay/build_source_suite.py \
            --manifest forecasting_2/stage2i_source_relay/STAGE2I_PRE_VALUE_MANIFEST.json \
            --output-root stage2i_source_output

      - name: Show decision
        if: always()
        run: cat stage2i_source_output/RUN_DECISION.json

      - name: Upload immutable source-suite result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2i-canonical-source-suite
          path: stage2i_source_output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
